$kind: http-example
name: '404 Not Found'
request:
  url: '{{baseUrl}}/api/integration/work-orders/{{workOrderNo}}/status'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Work order not found: WO-9999",
        "data": null
      }
