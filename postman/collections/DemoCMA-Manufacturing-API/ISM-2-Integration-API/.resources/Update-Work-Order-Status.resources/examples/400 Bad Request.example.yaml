$kind: http-example
name: '400 Bad Request'
request:
  url: '{{baseUrl}}/api/integration/work-orders/{{workOrderNo}}/status'
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "INVALID_STATUS",
        "remarks": "Bad status value"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Invalid work order status: INVALID_STATUS",
        "data": null
      }
