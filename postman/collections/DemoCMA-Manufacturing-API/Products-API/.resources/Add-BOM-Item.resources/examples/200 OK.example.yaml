$kind: http-example
name: '200 OK'
request:
  url: '{{baseUrl}}/api/products/bom-items'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "productCode": "PROD-001",
        "materialCode": "MAT-001",
        "quantityPerUnit": 2.5
      }
