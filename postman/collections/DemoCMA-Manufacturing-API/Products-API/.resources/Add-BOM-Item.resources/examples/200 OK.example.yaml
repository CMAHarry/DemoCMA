            "active": true,
            "createdAt": "2024-01-15T08:00:00",
            "updatedAt": "2024-01-15T08:00:00"
          },
          "material": {
            "id": 1,
            "materialCode": "MAT-001",
            "materialName": "Steel Rod",
            "unitOfMeasure": "KG",
