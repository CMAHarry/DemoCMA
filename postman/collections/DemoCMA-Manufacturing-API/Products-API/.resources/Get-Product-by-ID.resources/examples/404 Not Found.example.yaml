$kind: http-example
name: '404 Not Found'
request:
  url: '{{baseUrl}}/api/products/{{productId}}'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Product not found with id: 99",
        "data": null
      }
