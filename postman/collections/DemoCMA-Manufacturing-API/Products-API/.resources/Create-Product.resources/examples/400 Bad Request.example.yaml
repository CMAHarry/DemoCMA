$kind: http-example
name: '400 Bad Request'
request:
  url: '{{baseUrl}}/api/products'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "productCode": "",
        "productName": "",
        "description": "Missing required fields",
        "active": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Product code is required",
        "data": null
      }
