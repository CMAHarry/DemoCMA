$kind: http-request
name: Create Product
method: POST
url: '{{baseUrl}}/api/products'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productCode": "PROD-001",
      "productName": "Assembled Frame",
      "description": "Main structural frame assembly",
      "active": true
    }
examples: './.resources/Create-Product.resources/examples'