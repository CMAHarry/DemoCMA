$kind: http-example
name: '200 OK'
request:
  url: '{{baseUrl}}/api/materials/{{materialId}}'
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "materialCode": "MAT-001",
        "materialName": "Steel Rod (Updated)",
        "unitOfMeasure": "KG",
        "active": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Material updated",
        "data": {
          "id": 1,
          "materialCode": "MAT-001",
          "materialName": "Steel Rod (Updated)",
          "unitOfMeasure": "KG",
          "active": true,
          "createdAt": "2024-01-15T08:00:00",
          "updatedAt": "2024-01-15T09:30:00"
        }
      }
