services:
  mysql:
    image: mysql:8.4
    container_name: system-c-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: system_c_manufacturing_demo
    volumes:
      - system_c_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  system_c_mysql_data:
